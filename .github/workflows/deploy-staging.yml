name: Deploy staging

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: >-
          uv run python -m pytest
          --postgresql-host=127.0.0.1
          --postgresql-port=55432
          --postgresql-user=postgres
          --postgresql-dbname=pytest_db

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run ruff check src/ tests/

  build:
    needs: [test, lint]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: sa-east-1
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/login-action@v3
        with:
          registry: registry.cloudflare.com
          username: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          password: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            registry.cloudflare.com/${{ vars.CLOUDFLARE_ACCOUNT_ID }}/ugc-orchestrator:${{ github.sha }}
            ${{ vars.AWS_ECR_REGISTRY }}/ugc-orchestrator:${{ github.sha }}
      - name: Smoke-test FFmpeg assembly in the runtime image
        env:
          IMAGE: registry.cloudflare.com/${{ vars.CLOUDFLARE_ACCOUNT_ID }}/ugc-orchestrator:${{ github.sha }}
        run: |
          docker pull "$IMAGE"
          docker run --rm --entrypoint python \
            -v "$PWD/tests/runtime_ffmpeg_smoke.py:/tests/runtime_ffmpeg_smoke.py:ro" \
            "$IMAGE" /tests/runtime_ffmpeg_smoke.py

  migrate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: registry.cloudflare.com
          username: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          password: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Upgrade schema once with the direct Neon endpoint
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.STAGING_MIGRATION_DATABASE_URL }}
          ORCHESTRATOR_RUNTIME_PASSWORD: ${{ secrets.STAGING_RUNTIME_PASSWORD }}
          IMAGE: registry.cloudflare.com/${{ vars.CLOUDFLARE_ACCOUNT_ID }}/ugc-orchestrator:${{ github.sha }}
        run: |
          docker run --rm -e MIGRATION_DATABASE_URL "$IMAGE" migrate
          docker run --rm -e MIGRATION_DATABASE_URL -e ORCHESTRATOR_RUNTIME_PASSWORD "$IMAGE" db provision-runtime

  deploy:
    needs: [build, migrate]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - run: npm ci
      - name: Pin the already-built OCI image
        env:
          ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s/ACCOUNT_ID/${ACCOUNT_ID}/g; s/IMAGE_TAG/${IMAGE_TAG}/g" wrangler.jsonc
      - name: Gradual Worker and Container rollout
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --containers-rollout=gradual
