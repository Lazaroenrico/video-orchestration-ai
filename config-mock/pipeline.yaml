# Perfil dry-run offline: herda os knobs comuns de ../config-base/pipeline.yaml
# (deep-merge; este arquivo vence por chave). Aqui ficam só as diferenças do mock:
# tiers completos com custo de REFERÊNCIA (nada é cobrado), fps 25 e voz mock.
# Tentativas escalam o tier: 1ª LTX, 2ª Kling, 3ª Seedance (cheap -> premium).
tiers:
  - name: ltx
    model: lightricks/ltx-2.3-fast
    cost_per_second: 0.01
    max_concurrency: 16     # barato: alta concorrência (bulk de testes)
  - name: kling
    model: kling-3.0
    cost_per_second: 0.10
    max_concurrency: 6      # sinal: reprodução mais limpa
  - name: seedance
    model: seedance-2.0
    cost_per_second: 0.168
    max_concurrency: 2      # premium: vencedores, baixa concorrência

clip:
  fps: 25

voice:
  mode: mock
  provider: mock
