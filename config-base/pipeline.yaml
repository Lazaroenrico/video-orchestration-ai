# Knobs da pipeline compartilhados por TODOS os perfis (config/, config-mock/,
# config-staging/). O loader (src/orchestrator/config.py) faz deep-merge: o
# pipeline.yaml do perfil vence por chave; listas (ex.: tiers) são substituídas
# wholesale pelo overlay do perfil. Só edite aqui o que vale para os três perfis;
# diferenças por ambiente pertencem ao YAML de cada perfil.
batch:
  default_size: 12
  max_concurrency: 8        # fan-out paralelo no nível do item (RunnableConfig.max_concurrency)

qc:
  max_attempts: 3           # tentativas antes de descartar um item (Step 7 regen loop)
  fail_rate: 0.34           # fração determinística reprovada no mock (exercita o loop)

clip:
  duration_seconds: 8
  resolution: 1080p
  aspect_ratio: "9:16"
  camera_motion: static
  generate_audio: false

assembly:
  final_duration_seconds: 16
  narration_target_seconds: 16
  narration_min_words: 28
  narration_max_words: null
  resolution: "1080x1920"
  fps: 24

roster:
  creators: 2               # quantos creators reutilizáveis no roster (Step 3)

voice:
  design_model: eleven_ttv_v3
  tts_model: eleven_turbo_v2_5
  language_code: pt-BR
  candidates_per_creator: 3
  max_rerolls_per_creator: 2
  selection_without_review: first
  prompt_version: voice-match-v1
  preview_text_version: pt-br-ugc-v1
  request_timeout_seconds: 120
  concurrency: 1
