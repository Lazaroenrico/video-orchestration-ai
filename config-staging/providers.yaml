# Staging conectado a PostgreSQL/R2, ainda com geração 100% mock e custo zero.
# Uso: ORCH_CONFIG_DIR=/app/config-staging
#
# Diferença vs. config/: aqui NENHUM adapter real é instanciado, então não exige
# chaves (AI_GATEWAY_API_KEY, REPLICATE_API_TOKEN, etc.) nem gasta crédito. Ideal
# para demo do dashboard sem rede. Para ligar integrações reais, use config/.
adapters:
  llm: mock
  creator: mock
  video: mock
  qc: mock
  assembly: mock
  upscale: mock

# O bucket permanece privado; a API assina ponteiros r2:// apenas na saída.
storage:
  backend: r2
