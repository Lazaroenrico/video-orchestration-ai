# Perfil staging: geração mock conectada a PostgreSQL/R2 (custo zero). Herda os
# knobs comuns de ../config-base/pipeline.yaml; aqui só as diferenças: tiers
# determinísticos para exercitar routing/QC com custo operacional ZERO — o staging
# nunca atribui custo mesmo em tier com nome premium —, fps 25 e voz mock.
tiers:
  - name: ltx
    model: lightricks/ltx-2.3-fast
    cost_per_second: 0.0
    max_concurrency: 16     # barato: alta concorrência (bulk de testes)
  - name: kling
    model: kling-3.0
    cost_per_second: 0.0
    max_concurrency: 6      # sinal: reprodução mais limpa
  - name: seedance
    model: seedance-2.0
    cost_per_second: 0.0
    max_concurrency: 2      # premium: vencedores, baixa concorrência

clip:
  fps: 25

voice:
  mode: mock
  provider: mock
