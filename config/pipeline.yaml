# Parâmetros da pipeline. A topologia do grafo é fixa no builder (v2); este arquivo
# ajusta os "knobs" (tamanho de batch, concorrência, QC, custo/concorrência por tier).
batch:
  default_size: 12
  max_concurrency: 8        # fan-out paralelo no nível do item (RunnableConfig.max_concurrency)

qc:
  max_attempts: 3           # tentativas antes de descartar um item (Step 7 regen loop)
  fail_rate: 0.34           # fração determinística reprovada no mock (exercita o loop)
  required_clip_count: 2    # live: talking-head + product demo precisam existir antes da montagem

video:
  allow_mock_fallback: false # live: falha do provider é explícita; nunca gera mock
  product_demo_tier: ltx

# Roteamento + custo por tier (Step 4 / "The Cost at Scale" do Context.md).
tiers:
  - name: ltx
    model: lightricks/ltx-2.3-fast
    cost_per_second: 0.01
    max_concurrency: 2      # o throttle global também serializa voz e vídeo no Replicate

clip:
  duration_seconds: 8
  resolution: "720p"
  aspect_ratio: "9:16"
  fps: 24
  draft: true              # validação E2E de menor custo
  camera_motion: static
  generate_audio: false
  timeout_ms: 900000

latentsync:
  enabled: true
  model: "bytedance/latentsync"
  resolution: "720p"
  max_retries: 3
  required: true
  cost_per_second: 0.003


assembly:
  final_duration_seconds: 16
  narration_target_seconds: 16
  narration_min_words: 28
  narration_max_words: null
  audio_speedup_max: 1.10
  resolution: "1080x1920"
  fps: 24
  timeout_seconds: 300
  allow_mock_fallback: false # live: falha do FFmpeg surfa o erro no item (com clips + locução)

roster:
  creators: 2               # quantos creators reutilizáveis no roster (Step 3)

# Budget dos três agents criativos: concepts, scripts e creator_profiles.
# Cada fase aceita uma única submissão tipada. Vídeo, QC e montagem não usam agent loop.
agent:
  max_steps: 2              # one decision plus bounded recovery
  max_tool_calls: 1         # each creative agent submits exactly one typed result
  max_steps_by_stage:
    scripts: 3
  max_tool_calls_by_stage:
    scripts: 2              # budget extra apenas para recuperação estrutural do ToolStrategy

voice:
  mode: designed
  provider: elevenlabs
  design_model: eleven_ttv_v3
  tts_model: eleven_turbo_v2_5
  language_code: pt-BR
  candidates_per_creator: 3
  max_rerolls_per_creator: 2
  selection_without_review: first
  prompt_version: voice-match-v1
  preview_text_version: pt-br-ugc-v1
  request_timeout_seconds: 120
  concurrency: 1
  retry:
    max_retries: 3
    backoff_base_seconds: 1
    max_delay_seconds: 60
  costs:
    design_per_candidate_usd: 0.01
    tts_per_1000_chars_usd: 0.03
    cost_source: estimate
