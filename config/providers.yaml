# Perfil live: papéis runtime apontam para adapters reais/sem mock. Para dry-run
# sem rede/custo, use --config-dir config-mock.
# Papéis ausentes ainda caem em "mock" no registry, mas este arquivo não deixa
# nenhum papel runtime ausente.
adapters:
  llm: vercel_gateway_llm  # ✅ Claude via Vercel Gateway (AI_GATEWAY_API_KEY configurada)
  creator: creator_vercel_replicate_voice  # imagem Vercel; voz via ElevenLabs no Replicate
  video: replicate              # clips PrunaAI P-Video via Replicate; áudio fica para etapa posterior
  qc: integrity_qc              # checa mídia real e bloqueia mock/fallback antes da montagem
  assembly: ffmpeg_assembly     # concatena os 2 clips e muxa a locução; custo zero
  upscale: passthrough_upscale  # upscale do vídeo final (não da imagem); no-op até plugar upscaler de vídeo real
  judge: gateway

# Onde os bytes de mídia pousam (D30). Exige R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY e R2_BUCKET — sem elas o boot falha alto, de propósito.
# O endpoint não é env: from_env() o deriva de R2_ACCOUNT_ID.
# Dry-run sem rede/custo continua em --config-dir config-mock (backend local).
storage:
  backend: r2
