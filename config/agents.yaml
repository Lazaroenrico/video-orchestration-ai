# Live profile: only bounded creative work is agent-backed.
stages:
  concepts:
    executor: agent
    tools: [generate_concepts]
    target_model: null
    target_agent: concept-agent
    system_prompt_path: prompts/agents/concepts.md
    prompt_version: concepts-v2
    schema_version: creative-v2
    agent_enabled: true
  scripts:
    executor: agent
    tools: [write_script]
    target_model: null
    target_agent: script-agent
    system_prompt_path: prompts/agents/scripts.md
    prompt_version: scripts-v2
    schema_version: creative-v2
    agent_enabled: true
  creator_profiles:
    executor: agent
    tools: [design_creator_roster]
    target_model: null
    target_agent: creator-agent
    system_prompt_path: prompts/agents/creators.md
    prompt_version: creators-v2
    schema_version: creative-v2
    agent_enabled: true
  roster:
    executor: tool
    tools: [build_creator]
    agent_enabled: false
  video:
    executor: tool
    tools: [generate_clip]
    agent_enabled: false
  qc:
    executor: tool
    tools: [qc_check]
    agent_enabled: false
  voiceover:
    executor: tool
    tools: [synthesize_voiceover]
    agent_enabled: false
  assembly:
    executor: tool
    tools: [assemble_video]
    agent_enabled: false
  upscale:
    executor: tool
    tools: [upscale_video]
    agent_enabled: false
